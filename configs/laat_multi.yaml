## Multi-dataset DualLAAT config — trains one model jointly on MIMIC-III ICD-9,
## MIMIC-IV ICD-9, and MIMIC-IV ICD-10, matching the version-agnostic setup
## reported in the README's evaluation tables.
##
## To reproduce the "trained on frequent codes" row, set:
##     icd_target_frequency: 'frequent'
## To reproduce the default row, set:
##     icd_target_frequency: 'full'

## data
data_dir: '/path/to/Dual-LAAT/data'
data_w2v_dir: '/path/to/Dual-LAAT/data/w2v'

# Three datasets joined with '+' — handled by prepare_dataloaders.
icd_type: 'iv_icd10+iv_icd9+iii_icd9'
icd_target_frequency: 'full'

# Per-batch label sampling lets us train across vocabularies of different sizes.
negative_sampling_strategy: 'random'   # 'null' | 'random' | 'embeddings'
label_space: 1024                      # must be even
scope_for_negative_samples: 'full'     # 'full' | 'frequent' | 'terminology'

## training
debug: false
silent: false
seed: 42

output_dir: '/path/to/outputs'
max_epochs: 20
max_steps: -1
gpus: 1
max_input_length: 4000
batch_size: 16
accumulate_grad_batches: 2             # effective batch size 32
num_nodes: 1
precision: 32
num_warmup_steps: 2000
lr: 0.001
weight_decay: 0.001
scheduler_type: 'linear'

# Optional synthetic-data augmentation. Set these to mix in additional
# feather files placed under `{data_dir}/<alternative_data_folder>/`.
# Use 'only:<folder>' to train on synthetic data exclusively.
alternative_data_folder: null
alternative_icd_type: null

## model
model_type: 'laat'
rnn_hidden_size: 512
rnn_num_layers: 1
dropout: 0.3
num_mha_heads: 4
projection_dim: 512
rnn_type: 'gru'

num_workers: 2
